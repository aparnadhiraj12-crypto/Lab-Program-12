
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login / Register - ShopKart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html">ShopKart</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart <span class="cart-count">0</span></a>
      <a href="login.html">Login</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="container">
    <div class="form-card">
      <h2>Login</h2>
      <form id="loginForm">
        <input type="email" id="loginEmail"
               placeholder="Email" required>
        <input type="password" id="loginPassword"
               placeholder="Password" required>
        <button class="btn" type="submit">Login</button>
      </form>
      <p id="loginMessage" role="status"></p>

      <hr>

      <h2>Register</h2>
      <form id="registerForm">
        <input type="text" id="registerName"
               placeholder="Full Name" required>
        <input type="email" id="registerEmail"
               placeholder="Email" required>
        <input type="password" id="registerPassword"
               placeholder="Password" minlength="6" required>
        <button class="btn" type="submit">Register</button>
      </form>
      <p id="registerMessage" role="status"></p>
    </div>
  </main>

  <footer>© 2026 ShopKart</footer>
  <script src="script.js"></script>
</body>
</html>
